<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hindivine Admin</title>
  <meta name="description" content="Hindivine Admin: OPD appointments, leads CRM, sales, patients, team incentives, salary, stock, purchases, expenses, renewals and reports.">
  <meta name="theme-color" content="#0A2F55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Hindivine Admin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../img/icon-192.png">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Login: every person signs in with their own name and PIN -->
  <div class="lock" id="lock" hidden>
    <div class="lock-card">
      <img src="../img/logo.jpg" alt="Hindivine Healthcare" class="lock-logo" width="900" height="308">
      <div id="lock-body"></div>
    </div>
    <p class="lock-foot">Hindivine Healthcare Pvt. Ltd.<br><span>Developed by Aamir Sk · Hindivine Digital Marketing Team</span></p>
  </div>

  <div class="shell" id="shell" hidden>
    <aside class="side" id="side" aria-label="Main menu">
      <div class="side-head">
        <img src="../img/icon-192.png" alt="" width="42" height="42">
        <div><b>Hindivine Admin</b><small>Clinic management</small></div>
      </div>
      <div class="side-profile" id="side-profile"></div>
      <div class="side-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><input type="search" id="nav-search" placeholder="Search menu" aria-label="Search menu" autocomplete="off"></div>
      <div class="side-quick" id="side-quick"></div>
      <nav id="nav"></nav>
      <button type="button" class="side-lock" data-act="lock">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Log out</button>
      <p class="side-credit"></p>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="top">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="top-title"><h1 id="title">Dashboard</h1><small id="top-sub"></small></div>
        <button type="button" class="icon-btn bell" id="bell-btn" data-act="reminders" aria-label="Reminders" title="Reminders">
          <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><span class="bell-n" id="bell-n" hidden></span>
        </button>
        <button type="button" class="icon-btn" id="refresh-btn" data-act="refresh" aria-label="Refresh data" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
        </button>
        <button type="button" class="user-chip" id="user-chip" data-act="user-menu" aria-label="Account"><span id="user-initial">S</span></button>
      </header>
      <div class="ptr" id="ptr"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg></div>
      <main id="view"></main>
    </div>

    <nav class="tabs" id="tabs" aria-label="Quick menu"></nav>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <header><h2 id="modal-title"></h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></header>
      <div class="modal-body" id="modal-body"></div>
      <small class="err" id="modal-err"></small>
      <footer id="modal-foot"></footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="reminder-pop" id="reminder-pop" hidden></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
