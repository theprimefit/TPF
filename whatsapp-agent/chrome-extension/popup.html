<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  body { width: 370px; }
  main { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: center; gap: 8px; }
  header h1 { flex: 1; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; }
  .tile b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 11px; }
  .tile.alert b { color: var(--hot); }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  li .name { font-weight: 700; cursor: pointer; }
  li .why { grid-column: 1 / -1; font-size: 12px; color: var(--warn); }
  li .acts { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 4px; }
  li .acts button { padding: 4px 9px; font-size: 12px; }
  .status { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  .status span:first-child { flex: 1; }
  .switch { flex-direction: row; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
  .switch input { width: auto; margin: 0; accent-color: var(--ok); }
  .ok-text { color: var(--ok); font-weight: 600; } .warn-text { color: var(--warn); font-weight: 600; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <header><img src="icons/icon-32.png" width="24" height="24" alt=""><h1>Hindivine Leads</h1><button id="open">All leads</button></header>
  <div class="status" id="status" hidden><span id="statusText"></span><label class="switch" id="switchWrap"><input type="checkbox" id="enabled"><span>Auto-reply</span></label></div>
  <p class="msg err" id="err" hidden></p>
  <div class="banner" id="wa" hidden></div>
  <div class="tiles" id="tiles"></div>
  <h2>Needs attention</h2>
  <ul id="list"></ul>
  <p class="muted" id="foot"></p>
  <p class="muted"><a href="#" id="settings">Settings</a></p>
</main>
<script src="lib.js"></script>
<script src="popup.js"></script>
</body>
</html>
