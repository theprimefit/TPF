<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hindivine Leads · Settings</title>
<link rel="stylesheet" href="styles.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px; display: flex; flex-direction: column; gap: 14px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  .choice { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
  .choice input, .check input { width: auto; margin-top: 3px; accent-color: var(--accent); }
  .choice b { display: block; }
  .check { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; }
</style>
</head>
<body>
<main>
  <div style="display:flex;gap:10px;align-items:center"><img src="icons/icon-48.png" width="40" height="40" alt=""><div><h1>Hindivine Leads</h1><p class="muted">Settings</p></div></div>
  <form class="card" id="form">
    <h2>Where the agent runs</h2>
    <label class="choice"><input type="radio" name="mode" value="standalone"><span><b>In this browser (recommended, no setup)</b><span class="muted">The agent replies inside WhatsApp Web in Chrome. Keep the WhatsApp Web tab open.</span></span></label>
    <label class="choice"><input type="radio" name="mode" value="server"><span><b>Connect to an agent server</b><span class="muted">Only if you run the agent program on a computer or Render. Needs its address and dashboard password.</span></span></label>

    <div id="standaloneBox" style="display:flex;flex-direction:column;gap:10px">
      <label class="check"><input type="checkbox" id="replySaved"><span><b>Also reply to saved contacts</b><br><span class="muted">Off by default: the agent only answers numbers that aren't saved in your phone, so friends and family never get bot replies.</span></span></label>
    </div>

    <div id="serverBox" style="display:flex;flex-direction:column;gap:12px">
      <label for="server">Agent address
        <input id="server" placeholder="https://hindivine.ngrok-free.app or http://localhost:3000" autocomplete="off" spellcheck="false">
      </label>
      <label for="token">Dashboard password
        <input id="token" type="password" autocomplete="current-password">
      </label>
    </div>
    <button class="primary" type="submit" id="save">Save</button>
    <p class="msg" id="msg" hidden></p>
  </form>
</main>
<script src="lib.js"></script>
<script src="options.js"></script>
</body>
</html>
