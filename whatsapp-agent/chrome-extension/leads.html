<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hindivine Leads</title>
<link rel="stylesheet" href="styles.css">
<style>
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { flex: 1; }
  main { padding: 16px; max-width: 1300px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-width: 0; }
  .filters { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  .list { max-height: calc(100vh - 260px); overflow-y: auto; }
  .lead { padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .lead:hover, .lead.sel { background: var(--bg); }
  .lead .meta { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 1 / -1; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; font-size: 11px; color: var(--muted); margin-left: 4px; }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) 260px; }
  @media (max-width: 1100px) { .detail { grid-template-columns: minmax(0, 1fr); } }
  .chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  .msgs { padding: 12px; display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 330px); min-height: 240px; overflow-y: auto; }
  .m { max-width: 80%; padding: 7px 10px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--line); font-size: 13.5px; }
  .m.in { align-self: flex-start; background: var(--bg); }
  .m.out { align-self: flex-end; background: var(--ok-soft); }
  .m small { display: block; color: var(--muted); font-size: 11px; }
  .composer { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; min-width: 0; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; min-height: 40px; }
  .side { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; width: 100%; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header><img src="icons/icon-32.png" width="26" height="26" alt=""><h1>Hindivine Leads</h1><button id="csv">Export CSV</button><button id="settings">Settings</button></header>
<main>
  <p class="msg err" id="err" hidden></p>
  <div class="tiles" id="tiles"></div>
  <div class="layout">
    <section class="panel">
      <div class="filters"><input id="q" placeholder="Search name or number"><select id="filter" style="width:auto"><option value="">All</option><option value="attention">Needs attention</option><option value="hot">Hot</option><option value="booked">Booked</option></select></div>
      <div class="list" id="list"></div>
    </section>
    <section class="panel" id="detail"><div class="empty">Select a lead to see the chat.</div></section>
  </div>
</main>
<script src="lib.js"></script>
<script src="leads.js"></script>
</body>
</html>
